<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Private numerology analysis workspace.">
  <title>ANKA — Numerology Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="geometry geometry-one" aria-hidden="true">ॐ</div>
  <div class="geometry geometry-two" aria-hidden="true">श्री</div>
  <section id="login-view" class="login-view">
    <div class="login-symbol" aria-hidden="true"><span>ॐ</span></div>
    <p class="kicker">Private numerology workspace</p>
    <h1>ANKA</h1>
    <p class="login-intro">A quiet space for precise, workbook-grounded analysis.</p>
    <form id="login-form" class="login-form" novalidate>
      <label>Operator ID<input id="login-username" name="username" autocomplete="username" required></label>
      <label>Password<input id="login-password" name="password" type="password" autocomplete="current-password" required></label>
      <button class="gold-button" type="submit">Enter workspace <span>→</span></button>
      <p id="login-error" class="form-error" role="alert" hidden></p>
    </form>
  </section>
  <div id="app-view" class="app-view" hidden>
    <aside class="sidebar">
      <div class="sidebar-brand"><span class="brand-symbol">ॐ</span><div><strong>ANKA</strong><small>Private workspace</small></div></div>
      <nav aria-label="Analysis pages">
        <button class="nav-item active" data-page="primary"><span class="nav-number">01</span><span>Primary Sheldian Analysis</span></button>
        <button class="nav-item" data-page="vedic"><span class="nav-number">02</span><span>Vedic Numerology Analysis</span></button>
        <button class="nav-item" data-page="mobile"><span class="nav-number">03</span><span>Mobile Number Recommendation</span></button>
      </nav>
      <div class="sidebar-footer"><span class="status-dot"></span> Private session<p id="app-error" class="form-error" role="alert" hidden></p><button id="logout-button" class="logout-button" type="button">Log out</button></div>
    </aside>
    <main class="workspace">
      <header class="workspace-header"><div><p class="kicker">Numerology studio</p><h2 id="page-title">Primary Sheldian Analysis</h2></div><div class="header-decor" aria-hidden="true">१ ५ ९</div></header>
      <div id="page-primary" class="page active-page"></div>
      <div id="page-vedic" class="page" hidden></div>
      <div id="page-mobile" class="page" hidden></div>
    </main>
    <div id="report-modal" class="report-modal" hidden>
      <section class="report-dialog panel" role="dialog" aria-modal="true" aria-labelledby="report-dialog-title">
        <h2 id="report-dialog-title" class="sr-only">Generated report</h2>
        <button id="report-modal-close" class="report-modal-close" type="button" aria-label="Close generated report">&times;</button>
        <div id="report-modal-content"></div>
      </section>
    </div>
  </div>
  <script src="./app.js" defer></script>
</body>
</html>
